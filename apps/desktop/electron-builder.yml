appId: com.criativoos.desktop
productName: CriativoOS
executableName: CriativoOS
copyright: Copyright © CriativoOS
asar: true
npmRebuild: false
electronVersion: "35.7.5"

directories:
  output: release-dist
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: build-product
    to: app-product
    filter:
      - "**/*"
      - "!**/*.ts"
      - "!**/*.map"
      - "!**/.env"
      - "!**/*.db"

win:
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "CriativoOS-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "CriativoOS"

mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  category: public.app-category.productivity
  artifactName: "CriativoOS-${version}-universal.${ext}"

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Utility
  artifactName: "CriativoOS-${version}-x86_64.${ext}"

publish:
  provider: generic
  url: https://painel.criativoaistudio.com.br/api/releases
